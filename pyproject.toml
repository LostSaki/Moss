[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moss"
version = "0.2.9"
description = "Native Linux/SteamOS app for Windows games: Proton/Wine prefixes, missing-DLL fixes, Steam artwork, and setup.exe installs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moss" }]
dependencies = [
    "pyyaml>=6.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
moss = "moss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moss = [
    "recipes.yaml",
    "data/*.yaml",
    "ui/qml/*.qml",
    "ui/qml/qmldir",
    "ui/qml/components/*.qml",
    "ui/qml/pages/*.qml",
    "ui/qml/dialogs/*.qml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
