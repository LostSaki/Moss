name: Build binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach Moss binaries to
        required: true
        default: v0.2.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libdbus-1-3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm moss.spec

      - name: Package
        run: |
          chmod +x dist/Moss
          cp dist/Moss dist/Moss-linux-x86_64
          ls -lh dist/Moss-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: Moss-linux-x86_64
          path: dist/Moss-linux-x86_64

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Ensure tag exists as a release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Moss $TAG"
          fi
          gh release upload "$TAG" dist/Moss-linux-x86_64 --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm moss.spec

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dist\Moss.exe dist\Moss-windows-x86_64.exe
          Get-Item dist\Moss-windows-x86_64.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Moss-windows-x86_64
          path: dist/Moss-windows-x86_64.exe

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Moss $TAG"
          fi
          gh release upload "$TAG" dist/Moss-windows-x86_64.exe --clobber
